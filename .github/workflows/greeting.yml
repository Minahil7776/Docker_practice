name: 'deployment workflow'
on:
  push:
    branches:
      - main
jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v3

        - name: setup Node.js
          uses: actions/setup-node@v3
          with:
              node-version: '18'
              cache: npm

        - name: print node version
          run: node -v

        - name: install dependencies
          run: npm install

        - name: run tests
          run: npm test