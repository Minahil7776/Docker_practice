
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>User Management</h1>
        <p class="subtitle">Add and manage users in MongoDB</p>

        <form id="userForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email" required>
            </div>

            <button type="submit">Add User</button>
            <p id="message"></p>
        </form>

        <div class="users-header">
            <h2>All Users</h2>
            <button type="button" id="refreshBtn" class="refresh-btn">
                Refresh
            </button>
        </div>

        <div id="usersList">
            <p class="empty">Loading users...</p>
        </div>
    </div>

    <script>
        const userForm = document.getElementById("userForm");
        const usersList = document.getElementById("usersList");
        const message = document.getElementById("message");

        async function getUsers() {
            try {
                const response = await fetch("/getUsers");

                if (!response.ok) {
                    throw new Error("Could not load users");
                }

                const users = await response.json();
                usersList.replaceChildren();

                if (users.length === 0) {
                    usersList.textContent = "No users found.";
                    usersList.className = "empty";
                    return;
                }

                usersList.className = "users-list";

                users.forEach(user => {
                    const card = document.createElement("div");
                    card.className = "user-card";

                    const name = document.createElement("h3");
                    name.textContent = user.name;

                    const email = document.createElement("p");
                    email.textContent = user.email;

                    card.append(name, email);
                    usersList.appendChild(card);
                });
            } catch (error) {
                usersList.textContent = "Failed to load users.";
                usersList.className = "empty";
            }
        }

        userForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            message.textContent = "Adding user...";
            message.className = "";

            const user = {
                name: userForm.name.value.trim(),
                email: userForm.email.value.trim()
            };

            try {
                const response = await fetch("/addUser", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(user)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.message || "Failed to add user");
                }

                message.textContent = result.message;
                message.className = "success";
                userForm.reset();

                await getUsers();
            } catch (error) {
                message.textContent = error.message;
                message.className = "error";
            }
        });

        document.getElementById("refreshBtn")
            .addEventListener("click", getUsers);

        getUsers();
    </script>
</body>
</html>
